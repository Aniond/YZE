<script>function rollListAttack() { api.promptRoll(api.getValue("data.name") || "Attack", "1d100", [], { rollName: api.getValue("data.name") || "Attack", target: Number(api.getValue("data.value")) || 0, damage: api.getValue("data.damage") || "" }, "ability"); }</script>
<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:6px;align-items:end"><stringfield field="name" label="Attack"></stringfield><numberfield field="value" label="%"></numberfield><stringfield field="damage" label="Damage"></stringfield><numberfield field="reach" label="Reach"></numberfield><button field="roll" label="Roll" onclick="rollListAttack()"></button></div>
