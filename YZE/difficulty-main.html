<div style="background:#15110b; min-height:100%; padding:14px 16px;">

  <!-- Header: name + threshold -->
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:14px;">
    <div style="flex:1;">
      <namefield field="name" label="" bold="true" size="md"
        placeholder="Difficulty name…"
        style="font-family:Georgia,serif; font-size:20px; color:#f0d9b5;">
      </namefield>
    </div>
    <div style="background:#1c1610; border:2px solid #c8902a; border-radius:5px;
      padding:8px 16px; text-align:center; flex-shrink:0;">
      <div style="font-size:9px; font-weight:700; letter-spacing:0.2em;
        text-transform:uppercase; color:#7d6b54; margin-bottom:4px;">Required</div>
      <numberfield field="threshold" label="" size="sm"
        minvalue="1" maxvalue="6" defaultvalue="1"
        style="font-family:Georgia,serif; font-size:30px; font-weight:700;
          color:#c8902a; width:48px; text-align:center;">
      </numberfield>
      <div style="font-size:9px; color:#7d6b54; margin-top:2px;">successes</div>
    </div>
  </div>

  <!-- Description -->
  <div style="font-size:9px; font-weight:700; letter-spacing:0.22em;
    text-transform:uppercase; color:#7d6b54; margin-bottom:6px;">Description</div>
  <richtextfield field="description" label="" height="120px"
    placeholder="Example tasks, context, notes…">
  </richtextfield>

  <!-- Drag hint -->
  <div style="margin-top:14px; padding:10px 14px;
    border:1px dashed #3a2e1c; border-radius:4px;
    text-align:center; font-size:10px; color:#524535; line-height:1.5;">
    Drag this card onto a character or NPC sheet — or onto a token on the
    scene — to set their required successes for the next roll.
  </div>

  <div style="margin-top:12px; font-size:9px; color:#3a2e22;
    text-align:right; letter-spacing:0.06em;">
    Powered by Year Zero Engine
  </div>

</div>
