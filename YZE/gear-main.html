<script>
  // ── Sean's list-item context helpers (Tranche 0 fix) ─────────────────────
  // Inside a list-item template, api.getValue('data.X') reads the TOP-LEVEL
  // owning record. To read this item's OWN fields use ctx.dataPrefix instead.
  function getNearestParentDataPath(dp) {
    const parts = dp.split('.data');
    return parts.length > 1 ? parts.slice(0, -1).join('.data') : '';
  }

  function getItemContext() {
    const itemDataPath = getNearestParentDataPath(dataPath);
    const item         = itemDataPath ? api.getValue(itemDataPath) : record;
    const dp           = itemDataPath ? `${itemDataPath}.data`     : 'data';
    const fp           = itemDataPath ? `${itemDataPath}.fields`   : 'fields';
    return { item: item, dataPrefix: dp, fieldsPath: fp };
  }

  function onTypeChange() {
    const ctx = getItemContext();
    const t   = api.getValue(`${ctx.dataPrefix}.gearType`) || 'weapon';
    api.setValues({
      'fields.weaponFields.hidden': t !== 'weapon',
      'fields.armorFields.hidden':  t !== 'armor',
      'fields.weightField.hidden':  t === 'other'
    });
  }

  function rollAttack() {
    const ctx         = getItemContext();
    const itemName    = api.getValue(`${ctx.dataPrefix}.name`)        || 'Weapon';
    const gearBonus   = parseInt(api.getValue(`${ctx.dataPrefix}.bonus`)  || '0', 10);
    const damage      = parseInt(api.getValue(`${ctx.dataPrefix}.damage`) || '0', 10);
    const range       = api.getValue(`${ctx.dataPrefix}.range`)       || 'engaged';
    const linkedSkill = api.getValue(`${ctx.dataPrefix}.linkedSkill`) || 'Melee';
    const linkedAttr  = api.getValue(`${ctx.dataPrefix}.linkedAttr`)  || 'strength';

    // Read the character's attribute from the TOP-LEVEL record (confirmed by Sean).
    // dmgKey handles games with per-attribute damage; in YZE dmgVal is always 0.
    const dmgKey  = `dmg${linkedAttr.charAt(0).toUpperCase()}${linkedAttr.slice(1)}`;
    const attrVal = parseInt(api.getValue(`data.${linkedAttr}`) || '0', 10);
    const dmgVal  = parseInt(api.getValue(`data.${dmgKey}`)     || '0', 10);
    const effAttr = Math.max(0, attrVal - dmgVal);

    if (effAttr === 0 && gearBonus === 0) {
      api.showNotification('No dice to roll!', 'red', 'Cannot Attack');
      return;
    }

    api.roll(
      `${effAttr + gearBonus}d6`,
      {
        attrKey:    linkedAttr,
        attrCount:  effAttr,
        skillCount: 0,
        gearCount:  gearBonus,
        baseDamage: damage,
        skillName:  itemName,
        range:      range,
        isAttack:   true
      },
      'yze_combat'
    );
  }
</script>
