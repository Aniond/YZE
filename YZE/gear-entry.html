<script>
// ── Sean's list-item context helpers (Tranche 0 fix) ─────────────────────
// gear-entry.html is a list-item template. api.getValue('data.X') reads
// the TOP-LEVEL owning record. Use ctx.dataPrefix to read THIS item's fields.
function getNearestParentDataPath(dp) {
  const parts = dp.split('.data');
  return parts.length > 1 ? parts.slice(0, -1).join('.data') : '';
}

function getItemContext() {
  const itemDataPath = getNearestParentDataPath(dataPath);
  const item         = itemDataPath ? api.getValue(itemDataPath) : record;
  const dp           = itemDataPath ? `${itemDataPath}.data`     : 'data';
  const fp           = itemDataPath ? `${itemDataPath}.fields`   : 'fields';
  return { item: item, dataPrefix: dp, fieldsPath: fp };
}

function showHideStats() {
  const ctx      = getItemContext();
  const t        = api.getValue(`${ctx.dataPrefix}.gearType`) || 'equipment';
  const isWeapon = t === 'weapon';
  const isArmor  = t === 'armor';
  api.setValues({
    'fields.badgeWeapon.hidden':   !isWeapon,
    'fields.badgeArmor.hidden':    !isArmor,
    'fields.badgeEquip.hidden':    (isWeapon || isArmor),
    'fields.statWeapon.hidden':    !isWeapon,
    'fields.statArmor.hidden':     !isArmor,
    'fields.rollAttackBox.hidden': !isWeapon
  });
  checkRepairBtn();
}

// Show repair section when bonus is below its recorded maximum.
function checkRepairBtn() {
  const ctx      = getItemContext();
  const bonus    = parseInt(api.getValue(`${ctx.dataPrefix}.bonus`)    || '0', 10);
  const maxBonus = parseInt(api.getValue(`${ctx.dataPrefix}.maxBonus`) || '0', 10);
  api.setValues({ 'fields.repairSection.hidden': !(maxBonus > 0 && bonus < maxBonus) });
}

// Roll attack with this specific weapon. rollAttackForItem lives in common.js.
// When this button is dragged to the Hot Bar, Realm stores the onclick as a macro
// — clicking the Hot Bar macro fires this function in the context of this weapon.
function rollWeaponFromGear() {
  const ctx  = getItemContext();
  const item = ctx.item;
  if (!item || !item.data) return;
  rollAttackForItem(item);
}
</script>

<div style="display:flex; align-items:center; gap:8px; height:44px;
  width:100%; padding:0 8px; box-sizing:border-box;
  background:#1a1612; border-bottom:1px solid #2a2015;">

  <portrait field="portrait" width="30" height="30"
    style="border-radius:3px; border:1px solid #3a2e22;
      flex-shrink:0; cursor:pointer;">
  </portrait>

  <namefield field="name" label="" size="xs" bold="true"
    placeholder="Item..."
    style="flex:1; min-width:0; color:#f0d9b5;">
  </namefield>

  <!-- Type badge — only the matching one is shown -->
  <box field="badgeWeapon">
    <div style="font:700 8px sans-serif; letter-spacing:0.06em;
      color:#cc6666; background:rgba(204,51,51,0.15);
      border:1px solid rgba(204,51,51,0.25); border-radius:2px;
      padding:3px 7px; white-space:nowrap;">WEAPON</div>
  </box>
  <box field="badgeArmor">
    <div style="font:700 8px sans-serif; letter-spacing:0.06em;
      color:#6699cc; background:rgba(60,100,180,0.15);
      border:1px solid rgba(60,100,180,0.25); border-radius:2px;
      padding:3px 7px; white-space:nowrap;">ARMOR</div>
  </box>
  <box field="badgeEquip">
    <div style="font:700 8px sans-serif; letter-spacing:0.06em;
      color:#66aa77; background:rgba(60,140,80,0.15);
      border:1px solid rgba(60,140,80,0.25); border-radius:2px;
      padding:3px 7px; white-space:nowrap;">EQUIP</div>
  </box>

  <dropdown field="gearType" label="" size="xs"
    onload="showHideStats();"
    onchange="showHideStats();"
    style="width:84px; flex-shrink:0; color:#8a7055; font-size:11px;"
    options='[
      {"label":"Weapon",    "value":"weapon"},
      {"label":"Armor",     "value":"armor"},
      {"label":"Equipment", "value":"equipment"},
      {"label":"Other",     "value":"other"}
    ]'>
  </dropdown>

  <!-- Contextual stats -->
  <box field="statWeapon">
    <div style="display:flex; gap:4px; flex-shrink:0;">
      <numberfield field="bonus"  label="Bonus" size="xs"
        minvalue="0" maxvalue="6"  defaultvalue="0"
        style="width:46px;">
      </numberfield>
      <numberfield field="damage" label="Dmg"   size="xs"
        minvalue="0" maxvalue="12" defaultvalue="0"
        style="width:46px;">
      </numberfield>
    </div>
  </box>
  <box field="statArmor">
    <numberfield field="armorRating" label="Armor" size="xs"
      minvalue="0" maxvalue="6" defaultvalue="0"
      style="width:46px; flex-shrink:0;">
    </numberfield>
  </box>

  <!-- Roll Attack — shown for weapons; drag to Hot Bar for a per-weapon attack macro -->
  <box field="rollAttackBox">
    <button field="rollAttackBtn" label="Roll" color="red" size="xs"
      onclick="rollWeaponFromGear();"></button>
  </box>

  <!-- Repair section — shown only when bonus < maxBonus -->
  <box field="repairSection">
    <div style="display:flex; align-items:center; gap:4px; flex-shrink:0;">
      <numberfield field="repairDice" label="Dice" size="xs"
        minvalue="1" maxvalue="10" defaultvalue="3"
        style="width:44px; flex-shrink:0;">
      </numberfield>
      <button field="repairBtn" label="Repair" size="xs"
        color="default" variant="outline"
        onclick="rollGearRepair();"></button>
    </div>
  </box>

  <deletebutton style="flex-shrink:0; margin-left:2px;"></deletebutton>

</div>

<!-- Hidden tracking fields -->
<numberfield field="maxBonus" label="" defaultvalue="0"
  style="display:none;"></numberfield>
